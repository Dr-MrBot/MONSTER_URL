<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONSTER_URL 2.0 &middot; Secure Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070b12;
  --panel: #0e1524;
  --border: #1a263d;
  --txt: #f0f4f9;
  --dim: #7f93b2;
  --accent: #00ff88;
  --accent-glow: rgba(0, 255, 136, 0.2);
  --cyan: #00e5ff;
  --bad: #ff3366;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow: hidden;
}
/* Cyber Ambient Glows */
body::before {
  content: '';
  position: absolute;
  top: -20%;
  left: 20%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(0,255,136,0.12) 0%, rgba(0,0,0,0) 70%);
  border-radius: 50%;
  pointer-events: none;
}
body::after {
  content: '';
  position: absolute;
  bottom: -20%;
  right: 20%;
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(0,229,255,0.1) 0%, rgba(0,0,0,0) 70%);
  border-radius: 50%;
  pointer-events: none;
}

.login-card {
  background: rgba(14, 21, 36, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 36px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
  position: relative;
  z-index: 10;
}
.brand-header {
  text-align: center;
  margin-bottom: 28px;
}
.brand-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 14px;
  background: linear-gradient(135deg, rgba(0,255,136,0.2), rgba(0,229,255,0.2));
  border: 1px solid rgba(0, 255, 136, 0.4);
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  box-shadow: 0 0 20px var(--accent-glow);
}
.brand-header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #fff 30%, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.brand-header p {
  color: var(--dim);
  font-size: 13px;
  margin-top: 4px;
}

.form-group {
  margin-bottom: 18px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--dim);
  margin-bottom: 8px;
}
.input-wrap {
  position: relative;
}
input {
  width: 100%;
  background: #080d16;
  border: 1px solid var(--border);
  color: var(--txt);
  padding: 13px 16px;
  border-radius: 12px;
  font-size: 14.5px;
  font-family: inherit;
  outline: none;
  transition: all 0.2s ease;
}
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 14px var(--accent-glow);
}

button.btn-submit {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), #00cc66);
  color: #04090f;
  border: 0;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 4px 18px var(--accent-glow);
  margin-top: 10px;
}
button.btn-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(0, 255, 136, 0.35);
}
button.btn-submit:active {
  transform: translateY(0);
}

.err-msg {
  background: rgba(255, 51, 102, 0.12);
  border: 1px solid rgba(255, 51, 102, 0.3);
  color: var(--bad);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 16px;
  text-align: center;
}
.footer-note {
  margin-top: 24px;
  text-align: center;
  font-size: 11.5px;
  color: var(--dim);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}
</style>
</head>
<body>

<div class="login-card">
  <div class="brand-header">
    <div class="brand-icon">👾</div>
    <h1>MONSTER_URL 2.0</h1>
    <p>Target Monitoring & Public URL Console</p>
  </div>

  {% if error %}
    <div class="err-msg">⚠️ {{ error }}</div>
  {% endif %}

  <form method="post">
    <div class="form-group">
      <label>Admin Username</label>
      <div class="input-wrap">
        <input type="text" name="username" placeholder="Enter admin username" autocomplete="username" required autofocus>
      </div>
    </div>
    
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
    </div>

    <button type="submit" class="btn-submit">Sign In to Console</button>
  </form>

  <div class="footer-note" style="flex-direction:column; gap:4px">
    <div><span class="pulse-dot"></span> MONSTER_URL v2.0 &middot; Developed by <b>Mohammad Fahad</b></div>
    <div style="font-size:11px">
      <a href="https://github.com/Dr-MrBot" target="_blank" style="color:var(--cyan); text-decoration:none">GitHub</a> &bull; 
      <a href="https://www.instagram.com/dr_mr.bot/" target="_blank" style="color:var(--accent); text-decoration:none">Instagram</a>
    </div>
  </div>
</div>

</body>
</html>
